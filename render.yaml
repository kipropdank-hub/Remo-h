# Render Blueprint for Remo H — one Django web service serving the site,
# admin and JSON API, plus a managed PostgreSQL database.
# Deploy via Dashboard > New > Blueprint and select this repository.
# See DEPLOYMENT.md for the manual setup path and environment variable details.

databases:
  - name: remo-h-db
    plan: free
    databaseName: remo_h

services:
  - type: web
    name: remo-h-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    # Free web services have no pre-deploy command, so migrations, static file
    # collection and demo data seeding run on every boot. All are idempotent.
    startCommand: >-
      python backend/manage.py migrate --noinput &&
      python backend/manage.py collectstatic --noinput &&
      python backend/manage.py seed_data &&
      gunicorn --chdir backend backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.14
      - key: DATABASE_URL
        fromDatabase:
          name: remo-h-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'false'
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://remo-h-backend.onrender.com
