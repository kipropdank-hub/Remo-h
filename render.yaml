# Render Blueprint for Remo H (Django REST API + React/Vite frontend).
# Deploy via Dashboard > New > Blueprint and select this repository.
# See DEPLOYMENT.md for the manual setup path and environment variable details.

databases:
  - name: remo-h-db
    plan: free
    databaseName: remo_h

services:
  # Django REST API — Gunicorn + WhiteNoise
  - type: web
    name: remo-h-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    # Free web services have no pre-deploy command, so migrations and demo
    # data seeding run on every boot. Both commands are idempotent.
    startCommand: >-
      python backend/manage.py migrate --noinput &&
      python backend/manage.py collectstatic --noinput &&
      python backend/manage.py seed_data &&
      gunicorn --chdir backend backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/departments/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14
      - key: DATABASE_URL
        fromDatabase:
          name: remo-h-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'false'
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        # Change if Render assigns a different onrender.com subdomain.
        value: https://remo-h-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://remo-h-backend.onrender.com,https://remo-h-frontend.onrender.com

  # React + Vite single-page app hosted on the Render CDN
  - type: web
    name: remo-h-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Vite embeds this at build time; changing it requires a rebuild.
      - key: VITE_API_URL
        # Change if Render assigns a different onrender.com subdomain.
        value: https://remo-h-backend.onrender.com
    routes:
      # Let React Router handle deep links; real files are served first.
      - type: rewrite
        source: /*
        destination: /index.html
